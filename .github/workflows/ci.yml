name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate generated SVG
        run: |
          for file in .shots/scenes/*/*.svg; do
            xmllint --noout "$file"
          done
      - run: npm run build
      - run: npm run e2e
      - run: npm run e2e:real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: .shots/*.png
          if-no-files-found: ignore
