appId: com.phoneexplorer.app
productName: PhoneExplorer
copyright: Copyright © 2026 DansiDanutz
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
electronDist: node_modules/electron/dist
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  icon: build/icon.icns
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  title: PhoneExplorer
  artifactName: PhoneExplorer-${version}-${arch}.${ext}
win:
  target:
    - nsis
  icon: build/icon.png
linux:
  target:
    - AppImage
  category: Development
  icon: build/icon.png
